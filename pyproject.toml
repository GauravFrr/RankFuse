[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rankfuse"
version = "0.1.2"
description = "Hybrid retrieval (dense + sparse + RRF fusion + reranking) for RAG pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "RankFuse Authors" }
]
keywords = ["rag", "retrieval", "hybrid-search", "rrf", "reciprocal-rank-fusion", "vector-search", "bm25", "reranking", "chromadb", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.2",
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/GauravFrr/RankFuse"
Repository = "https://github.com/GauravFrr/RankFuse.git"
Issues = "https://github.com/GauravFrr/RankFuse/issues"
Documentation = "https://github.com/GauravFrr/RankFuse#readme"

[project.optional-dependencies]
cross-encoder = [
    "sentence-transformers>=2.2.2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "sentence-transformers>=2.2.2",  # needed for cross-encoder tests
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["examples/", "benchmarks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

